name: Deploy Prominense BE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t prominense-be:latest .

      - name: Run DB migrations
        run: |
          docker run --rm \
            --network easypanel-bd_owners \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            prominense-be:latest \
            sh -c 'npx prisma migrate deploy || (echo ">> one-time recovery: marcando 20260813000000 rolled-back y reintentando"; npx prisma migrate resolve --rolled-back 20260813000000_backfill_contract_status && npx prisma migrate deploy)'

      - name: Bootstrap RBAC super_admin (idempotent)
        # Secrets are forwarded via env: block (NOT inline ${{ }} inside the shell)
        # because the bcrypt hash starts with `$2b$` and bash would interpolate `$2`
        # as a positional parameter, corrupting the hash. Env block preserves the
        # raw value.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOOTSTRAP_RBAC_LOGIN: ${{ secrets.BOOTSTRAP_RBAC_LOGIN }}
          BOOTSTRAP_RBAC_EMAIL: ${{ secrets.BOOTSTRAP_RBAC_EMAIL }}
          BOOTSTRAP_RBAC_NAME: ${{ secrets.BOOTSTRAP_RBAC_NAME }}
          BOOTSTRAP_RBAC_PASSWORD_HASH: ${{ secrets.BOOTSTRAP_RBAC_PASSWORD_HASH }}
        run: |
          docker run --rm \
            --network easypanel-bd_owners \
            -e DATABASE_URL \
            -e BOOTSTRAP_RBAC_LOGIN \
            -e BOOTSTRAP_RBAC_EMAIL \
            -e BOOTSTRAP_RBAC_NAME \
            -e BOOTSTRAP_RBAC_PASSWORD_HASH \
            prominense-be:latest \
            npm run bootstrap-rbac

      - name: Deploy container
        run: |
          set -e
          docker network create ipnext-net 2>/dev/null || true
          # Force-remove old container (stop+rm in one). Fail loud if it can't.
          docker rm -f ipnext-new-backend 2>/dev/null || true
          docker run -d \
            --name ipnext-new-backend \
            --network ipnext-net \
            --network-alias backend \
            --restart unless-stopped \
            -p 8291:3000 \
            -e NODE_ENV=development \
            -e PORT=3000 \
            -e PRISMA_LOG_QUERIES="false" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e COOKIE_SECURE="${{ secrets.COOKIE_SECURE }}" \
            -e CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" \
            -e LOGIN_RATE_LIMIT="${{ secrets.LOGIN_RATE_LIMIT }}" \
            -e LOGIN_RATE_WINDOW_MS="${{ secrets.LOGIN_RATE_WINDOW_MS }}" \
            -e SPLYNX_API_URL="http://localhost" \
            -e SPLYNX_API_KEY="test" \
            -e SPLYNX_API_SECRET="test" \
            -e GR_SYNC_ENABLED="${{ secrets.GR_SYNC_ENABLED }}" \
            -e GR_CUIT="${{ secrets.GR_CUIT }}" \
            -e GR_SECRET="${{ secrets.GR_SECRET }}" \
            -e GR_SYNC_INTERVAL_MS="${{ secrets.GR_SYNC_INTERVAL_MS }}" \
            -e GR_SYNC_ESTADOS="${{ secrets.GR_SYNC_ESTADOS }}" \
            -e ICLASS_USERNAME="${{ secrets.ICLASS_USERNAME }}" \
            -e ICLASS_PASSWORD="${{ secrets.ICLASS_PASSWORD }}" \
            -e ICLASS_THIRD_PARTY_ID="${{ secrets.ICLASS_THIRD_PARTY_ID }}" \
            -e ICLASS_PORTAL_USER="${{ secrets.ICLASS_PORTAL_USER }}" \
            -e ICLASS_PORTAL_PASSWORD="${{ secrets.ICLASS_PORTAL_PASSWORD }}" \
            -e ICLASS_OCR_ENABLED="true" \
            -e OLLAMA_BASE_URL="${{ secrets.OLLAMA_BASE_URL }}" \
            -e OCR_MODEL="qwen2.5vl:7b" \
            -e ICLASS_AUDIT_ENABLED="true" \
            -e AUDIT_MODEL="qwen2.5vl:7b" \
            -e UISP_BASE_URL="${{ secrets.UISP_BASE_URL }}" \
            -e UISP_TOKEN="${{ secrets.UISP_TOKEN }}" \
            -e ROUTER_API_USER="${{ secrets.ROUTER_API_USER }}" \
            -e ROUTER_API_PASSWORD="${{ secrets.ROUTER_API_PASSWORD }}" \
            -e ROUTER_SSH_KEY="${{ secrets.ROUTER_SSH_KEY }}" \
            -e ROUTER_SSH_USER="prominense-be" \
            -e ROUTER_SSH_PORT="2026" \
            -e ROUTER_REDUCED_PROFILE="IP-REDUCCION" \
            -e ORCHESTRATOR_BASE_URL="${{ secrets.ORCHESTRATOR_BASE_URL }}" \
            -e ORCHESTRATOR_API_TOKEN="${{ secrets.ORCHESTRATOR_API_TOKEN }}" \
            -e RADIUS_AUTH_INGEST_INTERVAL_MS="${{ secrets.RADIUS_AUTH_INGEST_INTERVAL_MS }}" \
            -e AIROS_SSH_USER="ubnt" \
            -e AIROS_SSH_PASSWORDS="${{ secrets.AIROS_SSH_PASSWORDS }}" \
            -e EXTERNAL_API_KEY="${{ secrets.EXTERNAL_API_KEY }}" \
            -e MINIO_ENDPOINT="${{ secrets.MINIO_ENDPOINT }}" \
            -e MINIO_PORT="${{ secrets.MINIO_PORT }}" \
            -e MINIO_USE_SSL="${{ secrets.MINIO_USE_SSL }}" \
            -e MINIO_ACCESS_KEY="${{ secrets.MINIO_ACCESS_KEY }}" \
            -e MINIO_SECRET_KEY="${{ secrets.MINIO_SECRET_KEY }}" \
            -e MINIO_BUCKET="${{ secrets.MINIO_BUCKET }}" \
            prominense-be:latest
          docker network connect easypanel-bd_owners ipnext-new-backend

      - name: Verify
        run: |
          set -e
          sleep 5
          docker ps | grep ipnext-new-backend
          # Verify the container image SHA matches the freshly built :latest tag.
          # Catches the case where stop/rm silently failed and an old container
          # (with the previous image) keeps running.
          CONTAINER_IMG=$(docker inspect ipnext-new-backend --format '{{.Image}}')
          LATEST_IMG=$(docker inspect prominense-be:latest --format '{{.Id}}')
          if [ "$CONTAINER_IMG" != "$LATEST_IMG" ]; then
            echo "ERROR: container is running stale image"
            echo "  container: $CONTAINER_IMG"
            echo "  latest:    $LATEST_IMG"
            exit 1
          fi
          echo "OK — container image SHA matches latest: $CONTAINER_IMG"
