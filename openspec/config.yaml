schema: spec-driven

context: |
  Tech stack: Node.js + TypeScript 5.5 (ES2022, strict) + Express 4 + Prisma 7 + PostgreSQL
  Architecture: Hexagonal/Clean — domain / application / infrastructure. Manual DI wiring in app.ts (617 lines).
  Path aliases: @domain/*, @application/*, @infrastructure/*
  Testing: Jest 30 + ts-jest + supertest. Command: npm test. No coverageThreshold.
  Style: No ESLint, no Prettier. PascalCase classes, kebab-case routes, verb+noun use-cases.
  Source of truth: PostgreSQL. Splynx API is temporary reference — do NOT add new Splynx dependencies.

strict_tdd: true

testing:
  strict_tdd: true
  detected: "2026-07-26"   # re-verificado contra package.json (Jest 30, ts-jest 29, supertest 7; sin ESLint/Prettier)
  runner:
    command: "npm test"
    framework: "jest"
    config: "jest.config.js"
  layers:
    unit: { available: true, tool: "jest + ts-jest" }
    integration: { available: true, tool: "jest + supertest" }
    e2e: { available: false }
  coverage:
    available: true
    command: "npm run test:coverage"
    threshold_enforced: false
  quality:
    linter: { available: false }
    type_checker: { available: true, command: "tsc --noEmit" }
    formatter: { available: false }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
    - Flag if change touches src/infrastructure/http/app.ts (God Object risk)
    - Flag if change adds Splynx dependencies (architectural constraint: Splynx is being removed)
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect hexagonal boundaries: application MUST NOT import from infrastructure
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - STRICT TDD: write failing test first, then implementation
    - Do NOT couple application use-cases to concrete infra types — use domain interfaces
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "tsc --noEmit"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

known_debt:
  # Re-verificado el 2026-07-26 durante sdd-init (los datos previos eran del 2026-05-09).
  - id: naming-mismatch
    severity: RESOLVED
    description: >
      SALDADA. 0 de 133 archivos en src/infrastructure/adapters/prisma/ exportan clases InMemory*.
      El renaming se completó (ver commit f6585e2a). Se deja el registro para trazabilidad.
    files: "src/infrastructure/adapters/prisma/"
  - id: di-violation
    severity: HIGH
    description: >
      Los 3 archivos originales (ExportReport, GenerateReport, ListReportDefinitions) fueron
      CORREGIDOS, pero la deuda SE DESPLAZÓ a 4 archivos nuevos que importan de @infrastructure
      desde la capa application, violando DIP. Invertir la dependencia con un port en domain/ports/.
    files:
      - "src/application/use-cases/IngestClosedServiceOrders.ts"          # @infrastructure/adapters/search/sequenceNumberClause
      - "src/application/use-cases/gigared/ChangeTvPassword.ts"           # @infrastructure/security/gigaredPassword
      - "src/application/use-cases/gigared/RegisterGigaredAccount.ts"     # @infrastructure/security/gigaredPassword
      - "src/application/use-cases/TriggerUispSync.ts"                    # @infrastructure/scheduling/UispSyncScheduler
  - id: god-object-app
    severity: HIGH   # subida desde MEDIUM: el archivo se QUINTUPLICÓ
    description: >
      src/infrastructure/http/app.ts pasó de 617 a 3326 líneas (5,4x en ~2,5 meses) — todo el
      wiring manual de DI en un solo archivo. Todo change nuevo lo toca, lo que lo vuelve un
      punto de colisión permanente entre sesiones paralelas y un riesgo de merge conflict.
    files: "src/infrastructure/http/app.ts"
